name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: # build and test without publishing

jobs:
  source:
    name: Build source gem
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oxidize-rb/actions/setup-ruby-and-rust@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
          cargo-cache: true
      - run: bundle exec rake build
      - uses: actions/upload-artifact@v4
        with:
          name: gem-ruby
          path: pkg/*.gem

  native:
    name: Build native gem (${{ matrix.platform }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform:
          - x86_64-linux
          - x86_64-linux-musl
          - aarch64-linux
          - aarch64-linux-musl
          - x86_64-darwin
          - arm64-darwin
          - x64-mingw-ucrt
    steps:
      - uses: actions/checkout@v4
      - uses: oxidize-rb/actions/setup-ruby-and-rust@v1
        with:
          ruby-version: "3.4"
          bundler-cache: false
          cargo-cache: true
          cargo-vendor: true
      - uses: oxidize-rb/actions/cross-gem@v1
        id: cross-gem
        with:
          platform: ${{ matrix.platform }}
          # Keep in line with required_ruby_version in say_when.gemspec.
          # Rubies outside this list fall back to the source gem.
          ruby-versions: "3.2,3.3,3.4"
      - uses: actions/upload-artifact@v4
        with:
          name: gem-${{ matrix.platform }}
          path: ${{ steps.cross-gem.outputs.gem-path }}

  smoke:
    name: Test ${{ matrix.platform }} on Ruby ${{ matrix.ruby }}
    needs: native
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, platform: x86_64-linux }
          - { os: ubuntu-24.04-arm, platform: aarch64-linux }
          - { os: macos-latest, platform: arm64-darwin }
          - { os: macos-13, platform: x86_64-darwin }
          - { os: windows-latest, platform: x64-mingw-ucrt }
        ruby: ["3.2", "3.3", "3.4"]
    steps:
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
      - uses: actions/download-artifact@v4
        with:
          name: gem-${{ matrix.platform }}
          path: pkg
      - name: Install native gem
        shell: bash
        run: gem install pkg/*.gem
      - name: Load and read a date
        shell: bash
        run: |
          ruby -rsay_when -e '
            d = SayWhen::Reader.new(locale: :uk).day("tomorrow", today: Date.new(2026, 11, 16))
            abort("got #{d.inspect}") unless d == Date.new(2026, 11, 17)
            puts d
          '

  publish:
    name: Publish to RubyGems
    needs: [source, native, smoke]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write # RubyGems trusted publishing
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: gem-*
          path: pkg
          merge-multiple: true
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - uses: rubygems/configure-rubygems-credentials@v1.0.0
      - name: Push gems
        run: for gem in pkg/*.gem; do gem push "$gem"; done
